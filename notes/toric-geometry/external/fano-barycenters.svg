<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Preferred Fano polytopes and their barycenters</title><desc id="desc">The preferred anticanonical triangle of the projective plane has barycenter zero. The anticanonical trapezoid of the first Hirzebruch surface has barycenter (1/12,1/6), distinct from the origin. Both use facet distance one in their lattice.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#195684"/></marker><marker id="gray-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6Z" fill="#727e87"/></marker></defs>
<rect width="760" height="350" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202b33" font-size="14">
<text x="165.00" y="29.00" font-size="20" text-anchor="middle" fill="#202b33">P²</text>
<polygon points="66,249 258,249 66,57" fill="#edf4f8" stroke="#195684" stroke-width="2"/>
<circle cx="66" cy="249" r="3.7" fill="#195684"/>
<circle cx="258" cy="249" r="3.7" fill="#195684"/>
<circle cx="66" cy="57" r="3.7" fill="#195684"/>
<path d="M126 185h8 M130 181v8" stroke="#202b33" stroke-width="1.4"/>
<circle cx="130" cy="185" r="4.5" fill="#a43628"/>
<text x="142.00" y="173.00" font-size="14" text-anchor="start" fill="#8b2d22">b = 0</text>
<text x="165.00" y="290.00" font-size="15" text-anchor="middle" fill="#202b33">area 9/2; b = 0</text>
<text x="560.00" y="29.00" font-size="20" text-anchor="middle" fill="#202b33">F₁</text>
<polygon points="461,249 525,249 653,121 461,121" fill="#f4eee5" stroke="#195684" stroke-width="2"/>
<circle cx="461" cy="249" r="3.7" fill="#195684"/>
<circle cx="525" cy="249" r="3.7" fill="#195684"/>
<circle cx="653" cy="121" r="3.7" fill="#195684"/>
<circle cx="461" cy="121" r="3.7" fill="#195684"/>
<path d="M521 185h8 M525 181v8" stroke="#202b33" stroke-width="1.4"/>
<line x1="525" y1="185" x2="530.3333333333334" y2="174.33333333333334" stroke="#a43628" stroke-width="1.5"/>
<circle cx="530.3333333333334" cy="174.33333333333334" r="4.5" fill="#a43628"/>
<path d="M533.3333333333334 170.33333333333334L565.3333333333334 127.33333333333334" stroke="#a43628" fill="none"/>
<text x="558.33" y="120.33" font-size="14" text-anchor="start" fill="#8b2d22">b = (1/12, 1/6)</text>
<text x="481.00" y="208.00" font-size="12" text-anchor="start" fill="#202b33">(0, 0)</text>
<text x="560.00" y="290.00" font-size="15" text-anchor="middle" fill="#202b33">area 4; b ≠ 0</text>
<text x="380.00" y="333.00" font-size="14" text-anchor="middle" fill="#202b33">The origin is fixed by the anticanonical facet constants −1.</text>
</g>
