<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">The two conifold chambers and their common contraction</title>
  <desc id="desc">The positive chamber uses diagonal v1 v3 and the negative chamber uses diagonal v2 v4. Arrows point to the square without a diagonal, which represents the singular affine conifold.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#566272"/></marker>
  </defs>
  <rect width="760" height="280" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" text-anchor="middle" fill="#172b43">
    <text x="130" y="30">X₊ : θ &gt; 0</text>
    <text x="380" y="30">X₀ : θ = 0</text>
    <text x="630" y="30">X₋ : θ &lt; 0</text>
    <text x="130" y="267">C₊ ↔ diagonal v₁v₃</text>
    <text x="630" y="267">C₋ ↔ diagonal v₂v₄</text>
  </g>
  <g stroke="#34495e" stroke-width="2" stroke-linejoin="round">
    <path d="M60,210 L200,210 L200,70 Z" fill="#e2f0fc"/>
    <path d="M60,210 L200,70 L60,70 Z" fill="#f0f7fd"/>
    <path d="M310,210 L450,210 L450,70 L310,70 Z" fill="#f2f4f6"/>
    <path d="M560,210 L700,210 L560,70 Z" fill="#fff0dc"/>
    <path d="M700,210 L700,70 L560,70 Z" fill="#fff8ee"/>
  </g>
  <path d="M60,210 L200,70" stroke="#206aab" stroke-width="3" fill="none"/>
  <path d="M700,210 L560,70" stroke="#b86b18" stroke-width="3" fill="none"/>
  <g stroke="#566272" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M222,140 L284,140"/>
    <path d="M538,140 L476,140"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" text-anchor="middle" fill="#172b43">
    <text x="253" y="125">f₊</text><text x="507" y="125">f₋</text>
    <text x="48" y="232">v₁</text><text x="212" y="232">v₂</text><text x="212" y="61">v₃</text><text x="48" y="61">v₄</text>
    <text x="298" y="232">v₁</text><text x="462" y="232">v₂</text><text x="462" y="61">v₃</text><text x="298" y="61">v₄</text>
    <text x="548" y="232">v₁</text><text x="712" y="232">v₂</text><text x="712" y="61">v₃</text><text x="548" y="61">v₄</text>
  </g>
  <g fill="#172b43">
    <circle cx="60" cy="210" r="3.3"/><circle cx="200" cy="210" r="3.3"/><circle cx="200" cy="70" r="3.3"/><circle cx="60" cy="70" r="3.3"/>
    <circle cx="310" cy="210" r="3.3"/><circle cx="450" cy="210" r="3.3"/><circle cx="450" cy="70" r="3.3"/><circle cx="310" cy="70" r="3.3"/>
    <circle cx="560" cy="210" r="3.3"/><circle cx="700" cy="210" r="3.3"/><circle cx="700" cy="70" r="3.3"/><circle cx="560" cy="70" r="3.3"/>
  </g>
</svg>
