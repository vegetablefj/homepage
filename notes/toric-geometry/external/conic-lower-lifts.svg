<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title desc">
<title id="title">Two lower lifts for the rational normal conic</title><desc id="desc">With minimum-weight initial forms, use lower lifting heights minus omega. The first lift has two unit lower segments, producing a reduced pair of lines. The second lift has one lower segment of lattice length two, producing a double line.</desc>
