<div class="para">The locus <span class="process-math">\(\mathcal C_d\)</span> is a nonempty irreducible divisor in the moduli space of smooth cubic fourfolds if and only if <span class="process-math">\(d\gt6\)</span> and <span class="process-math">\(d\equiv0,2\pmod6\text{.}\)</span> The nonempty loci are called Hassett divisors, or Noether–Lefschetz divisors for cubic fourfolds.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ck3-hassett-existence-3-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
