<div class="para logical">
<div class="para">A cover <span class="process-math">\(\mathcal U\)</span> is <dfn class="terminology">acyclic for <span class="process-math">\(F\)</span></dfn> if</div>
<div class="displaymath process-math">
\begin{equation*}
H^q(U_{i_0\ldots i_p},F)=0
\end{equation*}
</div>
<div class="para">for every <span class="process-math">\(q&gt;0\)</span> and every nonempty finite intersection of members of the cover. This condition depends on both the cover and the sheaf.</div>
