<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.11</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">The mapping cone.</span>
</h2>
<div class="para logical">
<div class="para">For a morphism <span class="process-math">\(f:X\to Y\text{,}\)</span> its cone is</div>
<div class="displaymath process-math">
\begin{equation*}
\Cone(f)^n=Y^n\oplus X^{n+1},\qquad d(y,x)=(d_Yy+f x,-d_Xx).
\end{equation*}
</div>
<div class="para">It fits into the degreewise split exact sequence <span class="process-math">\(0\to Y\to\Cone(f)\to X[1]\to0\text{.}\)</span>
</div>
