</h2>
<div class="para logical">
<div class="para">The <em class="emphasis">birational Kähler cone</em> is the union</div>
<div class="displaymath process-math">
\begin{equation*}
\mathcal{BK}_X=\bigcup_{f:X\dashrightarrow Y}f^*(\mathcal K_Y),
\end{equation*}
</div>
<div class="para">where <span class="process-math">\(Y\)</span> runs through IHS manifolds bimeromorphic to <span class="process-math">\(X\text{.}\)</span> Its closure is taken in <span class="process-math">\(H^{1,1}(X,\R)\text{.}\)</span>
</div>
