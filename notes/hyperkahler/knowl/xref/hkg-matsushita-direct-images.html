<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.8</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">(Matsushita).</span>
</h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(f:X\to B\)</span> be a Lagrangian fibration from a projective IHS manifold, and assume that <span class="process-math">\(B\)</span> is smooth. Then</div>
<div class="displaymath process-math">
\begin{equation*}
R^if_*\cO_X\cong\Omega_B^i\qquad(0\leq i\leq n),
\end{equation*}
</div>
<div class="para">and the higher direct images vanish for <span class="process-math">\(i&gt;n\text{.}\)</span>
</div>
