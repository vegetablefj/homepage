\begin{equation}
\sum_{n\geq0}P_{S^{[n]}}(t)u^n
=\prod_{m\geq1}
\frac{
(1+t^{2m-1}u^m)^{b_1(S)}
(1+t^{2m+1}u^m)^{b_3(S)}
}{
(1-t^{2m-2}u^m)^{b_0(S)}
(1-t^{2m}u^m)^{b_2(S)}
(1-t^{2m+2}u^m)^{b_4(S)}
}.\tag{11.11}
\end{equation}
