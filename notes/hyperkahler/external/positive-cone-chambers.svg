<title id="title">A positive cone and its hyperplane chambers</title>
<desc id="desc">The unit disk is a slice of a Lorentz positive cone. Three negative-vector orthogonals cut it into chambers. The selected green chamber contains alpha. Eta is on one wall inside the positive cone.</desc>
