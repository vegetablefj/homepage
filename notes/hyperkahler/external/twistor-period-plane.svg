<svg xmlns="http://www.w3.org/2000/svg" width="670" height="470" viewBox="0 0 670 470" role="img" aria-labelledby="title desc">
  <title id="title">The twistor sphere and its oriented period plane</title>
  <desc id="desc">Inside the positive three-plane of a hyperkahler metric, the normalized Kahler classes form a unit sphere. The class omega I is perpendicular to the period plane spanned by omega J and omega K. The antipodal class corresponds to minus I and reverses the orientation of this period plane.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245c88"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426b4b"/></marker>
  </defs>
  <rect width="670" height="470" fill="white"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#243747">
    <text x="36" y="36" font-size="20">The positive three-plane P<tspan baseline-shift="sub" font-size="13">g</tspan></text>
    <circle cx="230" cy="240" r="155" fill="#f0f5fa" stroke="#7193b0" stroke-width="1.6"/>
    <ellipse cx="230" cy="240" rx="155" ry="89.489" fill="#dcebdc" fill-opacity="0.78" stroke="#65856a" stroke-width="1.5"/>
    <path d="M75 240 A155 89.489 0 0 1 385 240" fill="none" stroke="#65856a" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="230" y1="366.557" x2="230" y2="240" stroke="#245c88" stroke-width="1.6" stroke-dasharray="4 5"/>
    <line x1="230" y1="240" x2="230" y2="113.443" stroke="#245c88" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
    <line x1="230" y1="240" x2="339.602" y2="303.279" stroke="#426b4b" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <line x1="230" y1="240" x2="120.398" y2="303.279" stroke="#426b4b" stroke-width="1.6" marker-end="url(#arrow-green)"/>
    <circle cx="230" cy="240" r="3.2" fill="#243747"/>
    <circle cx="230" cy="113.443" r="4.2" fill="#245c88"/>
    <circle cx="230" cy="366.557" r="4.2" fill="#245c88"/>
    <text x="242" y="106" font-size="20">ω<tspan baseline-shift="sub" font-size="14">I</tspan>  ↔  I</text>
    <text x="242" y="384" font-size="19">−ω<tspan baseline-shift="sub" font-size="13">I</tspan>  ↔  −I</text>
    <text x="344" y="318" font-size="19">ω<tspan baseline-shift="sub" font-size="13">J</tspan></text>
    <text x="90" y="319" font-size="19">ω<tspan baseline-shift="sub" font-size="13">K</tspan></text>
    <text x="204" y="263" font-size="16">0</text>
    <path d="M314 283 C298 306 264 321 230 322" fill="none" stroke="#426b4b" stroke-width="1.7" marker-end="url(#arrow-green)"/>
    <path d="M380 242 L430 220" stroke="#65856a" stroke-width="1.2"/>
    <text x="440" y="211" font-size="19">oriented period plane</text>
    <text x="440" y="243" font-size="21">ω<tspan baseline-shift="sub" font-size="14">I</tspan><tspan baseline-shift="super" font-size="14">⊥</tspan> = ⟨ω<tspan baseline-shift="sub" font-size="14">J</tspan>, ω<tspan baseline-shift="sub" font-size="14">K</tspan>⟩</text>
    <text x="440" y="286" font-size="21">[σ<tspan baseline-shift="sub" font-size="14">I</tspan>] = [ω<tspan baseline-shift="sub" font-size="14">J</tspan> + iω<tspan baseline-shift="sub" font-size="14">K</tspan>]</text>
    <text x="36" y="438" font-size="16">After a common rescaling, q(ω<tspan baseline-shift="sub" font-size="11">I</tspan>) = q(ω<tspan baseline-shift="sub" font-size="11">J</tspan>) = q(ω<tspan baseline-shift="sub" font-size="11">K</tspan>) = 1.</text>
  </g>
</svg>
