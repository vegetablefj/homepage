<div class="para logical">
<div class="para">A degeneration of IHS manifolds has <em class="emphasis">type III monodromy</em> if</div>
<div class="displaymath process-math">
\begin{equation*}
N_2^2\ne0,\qquad N_2^3=0.
\end{equation*}
</div>
<div class="para">It is <em class="emphasis">maximally unipotent</em> in dimension <span class="process-math">\(2n\)</span> if <span class="process-math">\(N_{2n}^{2n}\ne0\text{.}\)</span>
</div>
