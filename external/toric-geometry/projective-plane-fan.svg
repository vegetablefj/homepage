<svg xmlns="http://www.w3.org/2000/svg" width="480" height="355" viewBox="0 0 480 355" role="img" aria-labelledby="title desc">
<title id="title">The fan of the projective plane</title><desc id="desc">Three two-dimensional cones generated in pairs by (1,0), (0,1), and (-1,-1). Each ray gives a coordinate divisor and each maximal cone a fixed point.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#195684"/></marker><marker id="gray-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6Z" fill="#727e87"/></marker></defs>
<rect width="480" height="355" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202b33" font-size="14">
<polygon points="445.00,175.00 445.00,40.00 245.00,40.00 245.00,175.00" fill="#edf4f8"/>
<polygon points="35.00,315.00 105.00,315.00 245.00,175.00 245.00,40.00 35.00,40.00" fill="#f4eee5"/>
<polygon points="105.00,315.00 445.00,315.00 445.00,175.00 245.00,175.00" fill="#eaf3e9"/>
<line x1="245" y1="175" x2="370.0" y2="175.0" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="345" cy="175" r="4.3" fill="#195684"/>
<text x="320.00" y="199.00" font-size="14" text-anchor="start" fill="#202b33">v₁ = (1, 0)</text>
<line x1="245" y1="175" x2="245.0" y2="50.0" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="245" cy="75" r="4.3" fill="#195684"/>
<text x="255.00" y="66.00" font-size="14" text-anchor="start" fill="#202b33">v₂ = (0, 1)</text>
<line x1="245" y1="175" x2="120.0" y2="300.0" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="145" cy="275" r="4.3" fill="#195684"/>
<text x="90.00" y="304.00" font-size="14" text-anchor="start" fill="#202b33">v₀ = (−1, −1)</text>
<text x="285.00" y="105.00" font-size="19" text-anchor="start" fill="#202b33">σ₀</text>
<text x="110.00" y="110.00" font-size="19" text-anchor="start" fill="#202b33">σ₁</text>
<text x="270.00" y="270.00" font-size="19" text-anchor="start" fill="#202b33">σ₂</text>
<text x="240.00" y="337.00" font-size="14" text-anchor="middle" fill="#202b33">Three maximal cones cover the whole real plane.</text>
</g>
</svg>
