<title id="title">Lattice slices of a Reeve tetrahedron and its double</title><desc id="desc">At height z=1, the Reeve tetrahedron Q3 has triangular slice with vertices (1/3,1/3), (1,1/3), (1/3,1), containing no integer point. The same slice of 2Q3 has vertices (1/3,1/3), (2,1/3), (1/3,2) and contains the integer point (1,1). This represents a degree-two element not generated in degree one.</desc>
