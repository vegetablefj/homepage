<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">The minimal toric resolution for five halves</title><desc id="desc">The cone with edges (1,0) and (-2,5) is subdivided at (0,1) and (-1,3). The exceptional chain has self-intersections minus three and minus two.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#195684"/></marker><marker id="gray-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6Z" fill="#727e87"/></marker></defs>
<rect width="760" height="350" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202b33" font-size="14">
<polygon points="245,268 287,268 245,226" fill="#edf4f8"/>
<polygon points="245,268 245,226 203,142" fill="#f4eee5"/>
<polygon points="245,268 203,142 161,58" fill="#eaf3e9"/>
<line x1="245" y1="268" x2="287" y2="268" stroke="#195684" stroke-width="2.1" marker-end="url(#blue-arrow)"/>
<text x="295.00" y="288.00" font-size="14" text-anchor="start" fill="#202b33">(1, 0)</text>
<line x1="245" y1="268" x2="245" y2="226" stroke="#195684" stroke-width="2.1" marker-end="url(#blue-arrow)"/>
<text x="255.00" y="226.00" font-size="14" text-anchor="start" fill="#202b33">(0, 1)</text>
<line x1="245" y1="268" x2="203" y2="142" stroke="#195684" stroke-width="2.1" marker-end="url(#blue-arrow)"/>
<text x="133.00" y="135.00" font-size="14" text-anchor="start" fill="#202b33">(-1, 3)</text>
<line x1="245" y1="268" x2="161" y2="58" stroke="#195684" stroke-width="2.1" marker-end="url(#blue-arrow)"/>
<text x="79.00" y="53.00" font-size="14" text-anchor="start" fill="#202b33">(-2, 5)</text>
<text x="100.00" y="30.00" font-size="17" text-anchor="start" fill="#202b33">5/2 = [3, 2]</text>
<text x="245.00" y="318.00" font-size="14" text-anchor="middle" fill="#202b33">Adjacent determinants are all 1.</text>
<text x="565.00" y="85.00" font-size="17" text-anchor="middle" fill="#202b33">Exceptional curves</text>
<line x1="505" y1="172" x2="640" y2="172" stroke="#727e87" stroke-width="2"/>
<circle cx="505" cy="172" r="12" fill="#e7f1f6" stroke="#195684" stroke-width="2"/>
<text x="505.00" y="143.00" font-size="17" text-anchor="middle" fill="#202b33">E₁</text>
<text x="505.00" y="213.00" font-size="17" text-anchor="middle" fill="#202b33">−3</text>
<circle cx="640" cy="172" r="12" fill="#e7f1f6" stroke="#195684" stroke-width="2"/>
<text x="640.00" y="143.00" font-size="17" text-anchor="middle" fill="#202b33">E₂</text>
<text x="640.00" y="213.00" font-size="17" text-anchor="middle" fill="#202b33">−2</text>
<text x="572.00" y="168.00" font-size="13" text-anchor="middle" fill="#202b33">1</text>
<text x="570.00" y="270.00" font-size="14" text-anchor="middle" fill="#202b33">Self-intersections: Eᵢ² = −bᵢ</text>
</g>
</svg>
