<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">A subdivision giving the blowup of the affine plane</title><desc id="desc">The first quadrant is subdivided by the primitive vector e1+e2. The two new cones give the charts k[x,y/x] and k[x/y,y] of the blowup of the origin.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#195684"/></marker><marker id="gray-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6Z" fill="#727e87"/></marker></defs>
<rect width="760" height="310" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202b33" font-size="14">
<rect x="70" y="55" width="240" height="175" fill="#edf4f8"/>
<line x1="70" y1="230" x2="240" y2="230" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="185" cy="230" r="4" fill="#195684"/>
<text x="194.00" y="248.00" font-size="14" text-anchor="start" fill="#202b33">e₁</text>
<line x1="70" y1="230" x2="70" y2="60" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="70" cy="115" r="4" fill="#195684"/>
<text x="79.00" y="133.00" font-size="14" text-anchor="start" fill="#202b33">e₂</text>
<text x="65.00" y="30.00" font-size="17" text-anchor="start" fill="#202b33">The original cone</text>
<rect x="460" y="55" width="240" height="175" fill="#edf4f8"/>
<polygon points="460,230 635,55 700,55 700,230" fill="#f4eee5"/>
<line x1="460" y1="230" x2="630" y2="230" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="575" cy="230" r="4" fill="#195684"/>
<text x="584.00" y="248.00" font-size="14" text-anchor="start" fill="#202b33">e₁</text>
<line x1="460" y1="230" x2="460" y2="60" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="460" cy="115" r="4" fill="#195684"/>
<text x="469.00" y="133.00" font-size="14" text-anchor="start" fill="#202b33">e₂</text>
<line x1="460" y1="230" x2="630" y2="60" stroke="#195684" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
<circle cx="575" cy="115" r="4" fill="#195684"/>
<text x="584.00" y="133.00" font-size="14" text-anchor="start" fill="#202b33">e₁ + e₂</text>
<text x="455.00" y="30.00" font-size="17" text-anchor="start" fill="#202b33">After subdivision</text>
<text x="380.00" y="145.00" font-size="28" text-anchor="middle" fill="#202b33">→</text>
<text x="175.00" y="278.00" font-size="16" text-anchor="middle" fill="#202b33">k[x, y]</text>
<text x="580.00" y="278.00" font-size="16" text-anchor="middle" fill="#202b33">k[x, y/x]   and   k[x/y, y]</text>
</g>
</svg>
