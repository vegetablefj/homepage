<svg xmlns="http://www.w3.org/2000/svg" width="760" height="275" viewBox="0 0 760 275" role="img" aria-labelledby="title desc">
<title id="title">Mixed area for the Bernstein rectangle example</title><desc id="desc">The unit square has area one, the two by one rectangle has area two, and their Minkowski sum is a three by two rectangle of area six. The mixed coefficient is six minus one minus two, equal to three.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#195684"/></marker><marker id="gray-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6Z" fill="#727e87"/></marker></defs>
<rect width="760" height="275" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202b33" font-size="14">
<text x="68.50" y="35.00" font-size="19" text-anchor="middle" fill="#202b33">P₁</text>
<rect x="40" y="143" width="57" height="57" fill="#edf4f8" stroke="#195684" stroke-width="2"/>
<circle cx="40" cy="200" r="3.3" fill="#195684"/>
<circle cx="40" cy="143" r="3.3" fill="#195684"/>
<circle cx="97" cy="200" r="3.3" fill="#195684"/>
<circle cx="97" cy="143" r="3.3" fill="#195684"/>
<text x="68.50" y="231.00" font-size="16" text-anchor="middle" fill="#202b33">area 1</text>
<text x="322.00" y="35.00" font-size="19" text-anchor="middle" fill="#202b33">P₂</text>
<rect x="265" y="143" width="114" height="57" fill="#f4eee5" stroke="#195684" stroke-width="2"/>
<circle cx="265" cy="200" r="3.3" fill="#195684"/>
<circle cx="265" cy="143" r="3.3" fill="#195684"/>
<circle cx="322" cy="200" r="3.3" fill="#195684"/>
<circle cx="322" cy="143" r="3.3" fill="#195684"/>
<circle cx="379" cy="200" r="3.3" fill="#195684"/>
<circle cx="379" cy="143" r="3.3" fill="#195684"/>
<text x="322.00" y="231.00" font-size="16" text-anchor="middle" fill="#202b33">area 2</text>
<text x="590.50" y="35.00" font-size="19" text-anchor="middle" fill="#202b33">P₁ + P₂</text>
<rect x="505" y="86" width="171" height="114" fill="#eaf3e9" stroke="#195684" stroke-width="2"/>
<circle cx="505" cy="200" r="3.3" fill="#195684"/>
<circle cx="505" cy="143" r="3.3" fill="#195684"/>
<circle cx="505" cy="86" r="3.3" fill="#195684"/>
<circle cx="562" cy="200" r="3.3" fill="#195684"/>
<circle cx="562" cy="143" r="3.3" fill="#195684"/>
<circle cx="562" cy="86" r="3.3" fill="#195684"/>
<circle cx="619" cy="200" r="3.3" fill="#195684"/>
<circle cx="619" cy="143" r="3.3" fill="#195684"/>
<circle cx="619" cy="86" r="3.3" fill="#195684"/>
<circle cx="676" cy="200" r="3.3" fill="#195684"/>
<circle cx="676" cy="143" r="3.3" fill="#195684"/>
<circle cx="676" cy="86" r="3.3" fill="#195684"/>
<text x="590.50" y="231.00" font-size="16" text-anchor="middle" fill="#202b33">area 6</text>
<text x="185.00" y="154.00" font-size="25" text-anchor="middle" fill="#202b33">+</text>
<text x="445.00" y="154.00" font-size="25" text-anchor="middle" fill="#202b33">=</text>
<text x="380.00" y="265.00" font-size="17" text-anchor="middle" fill="#202b33">2! V(P₁, P₂) = 6 − 1 − 2 = 3</text>
</g>
</svg>
