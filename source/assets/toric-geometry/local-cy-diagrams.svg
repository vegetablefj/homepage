<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title desc">
<title id="title">Two local Calabi-Yau toric diagrams</title><desc id="desc">Left: local projective plane has a triangle with an interior lattice point and three unimodular triangles. Right: the resolved conifold has a unit square and two triangles. An internal edge corresponds to a compact invariant curve.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#195684"/></marker><marker id="gray-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6Z" fill="#727e87"/></marker></defs>
<rect width="760" height="345" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202b33" font-size="14">
<text x="185.00" y="30.00" font-size="17" text-anchor="middle" fill="#202b33">The total space of K on P²</text>
<text x="570.00" y="30.00" font-size="17" text-anchor="middle" fill="#202b33">The resolved conifold</text>
<polygon points="185,160 263,160 185,82" fill="#edf4f8" stroke="#195684" stroke-width="1.8"/>
<polygon points="185,160 185,82 107,238" fill="#f4eee5" stroke="#195684" stroke-width="1.8"/>
<polygon points="185,160 107,238 263,160" fill="#eaf3e9" stroke="#195684" stroke-width="1.8"/>
<circle cx="185" cy="160" r="4.5" fill="#195684"/>
<text x="195.00" y="179.00" font-size="13" text-anchor="start" fill="#202b33">(0, 0)</text>
<circle cx="263" cy="160" r="4.5" fill="#195684"/>
<text x="271.00" y="166.00" font-size="13" text-anchor="start" fill="#202b33">(1, 0)</text>
<circle cx="185" cy="82" r="4.5" fill="#195684"/>
<text x="195.00" y="73.00" font-size="13" text-anchor="start" fill="#202b33">(0, 1)</text>
<circle cx="107" cy="238" r="4.5" fill="#195684"/>
<text x="44.00" y="260.00" font-size="13" text-anchor="start" fill="#202b33">(-1, -1)</text>
<polygon points="505,235 645,235 645,95" fill="#edf4f8" stroke="#195684" stroke-width="1.8"/>
<polygon points="505,235 645,95 505,95" fill="#f4eee5" stroke="#195684" stroke-width="1.8"/>
<circle cx="505" cy="235" r="4.5" fill="#195684"/>
<text x="456.00" y="256.00" font-size="13" text-anchor="start" fill="#202b33">(0, 0)</text>
<circle cx="645" cy="235" r="4.5" fill="#195684"/>
<text x="653.00" y="256.00" font-size="13" text-anchor="start" fill="#202b33">(1, 0)</text>
<circle cx="645" cy="95" r="4.5" fill="#195684"/>
<text x="653.00" y="86.00" font-size="13" text-anchor="start" fill="#202b33">(1, 1)</text>
<circle cx="505" cy="95" r="4.5" fill="#195684"/>
<text x="456.00" y="86.00" font-size="13" text-anchor="start" fill="#202b33">(0, 1)</text>
<text x="185.00" y="298.00" font-size="14" text-anchor="middle" fill="#202b33">3 triangles; 3 compact internal edges</text>
<text x="570.00" y="298.00" font-size="14" text-anchor="middle" fill="#202b33">2 triangles; 1 compact internal edge</text>
<text x="380.00" y="330.00" font-size="13" text-anchor="middle" fill="#202b33">Coordinates are shown in the affine lattice plane at height 1.</text>
