<svg xmlns="http://www.w3.org/2000/svg" width="560" height="370" viewBox="0 0 560 370" role="img" aria-labelledby="title desc">
<title id="title">The tropicalization of the pair of pants</title><desc id="desc">The tropicalization of x+y=1 with the minimum convention consists of the positive coordinate rays and the negative diagonal ray. Their initial polynomials are y-1, x-1, and x+y respectively. No two-dimensional cones are included.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#195684"/></marker><marker id="gray-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6Z" fill="#727e87"/></marker></defs>
<rect width="560" height="370" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#202b33" font-size="14">
<text x="280.00" y="30.00" font-size="16" text-anchor="middle" fill="#202b33">Weights w = (a, b): a tied minimum of a, b, 0</text>
<line x1="280" y1="175" x2="409.6" y2="175.0" stroke="#195684" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<circle cx="376" cy="175" r="4.2" fill="#195684"/>
<text x="359.00" y="203.00" font-size="14" text-anchor="start" fill="#202b33">(1, 0)</text>
<line x1="280" y1="175" x2="280.0" y2="45.39999999999998" stroke="#195684" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<circle cx="280" cy="79" r="4.2" fill="#195684"/>
<text x="290.00" y="71.00" font-size="14" text-anchor="start" fill="#202b33">(0, 1)</text>
<line x1="280" y1="175" x2="150.39999999999998" y2="304.6" stroke="#195684" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
<circle cx="184" cy="271" r="4.2" fill="#195684"/>
<text x="127.00" y="302.00" font-size="14" text-anchor="start" fill="#202b33">(−1, −1)</text>
<circle cx="280" cy="175" r="3.2" fill="#195684"/>
<text x="289.00" y="194.00" font-size="13" text-anchor="start" fill="#202b33">0</text>
<text x="382.00" y="239.00" font-size="14" text-anchor="start" fill="#202b33">initial: y − 1</text>
<text x="315.00" y="100.00" font-size="14" text-anchor="start" fill="#202b33">initial: x − 1</text>
<text x="74.00" y="264.00" font-size="14" text-anchor="start" fill="#202b33">initial: x + y</text>
<text x="280.00" y="344.00" font-size="14" text-anchor="middle" fill="#202b33">Three rays and the zero cone; no two-dimensional cones.</text>
</g>
</svg>
